name: Publish to Maven Central

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: Version configured as navHelper in gradle/libs.versions.toml
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-maven-central
  cancel-in-progress: false

jobs:
  publish:
    name: Build, test and publish
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17 and 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: |
            17
            25

      - name: Register JDK toolchains for Gradle
        run: |
          mkdir -p "$HOME/.gradle"
          installations=""
          for var in $(env | sed -nE 's/^(JAVA_HOME_[0-9]+_[A-Za-z0-9]+)=.*/\1/p'); do
            path="${!var}"
            if [[ -n "$path" && -d "$path" ]]; then
              if [[ -n "$installations" ]]; then
                installations="$installations,$path"
              else
                installations="$path"
              fi
            fi
          done
          echo "Detected toolchains: $installations"
          echo "org.gradle.java.installations.paths=$installations" >> "$HOME/.gradle/gradle.properties"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@67621b124fd2e251c5e8a0e6e3b91318f2287669 # v6.3.0

      - name: Resolve version
        id: resolve
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          configured_version="$(sed -nE 's/^navHelper[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' gradle/libs.versions.toml)"
          if [[ -z "$configured_version" ]]; then
            echo "::error::Could not read navHelper from gradle/libs.versions.toml"
            exit 1
          fi

          if [[ -n "$REQUESTED_VERSION" && "$REQUESTED_VERSION" != "$configured_version" ]]; then
            echo "::error::Requested version $REQUESTED_VERSION does not match configured version $configured_version"
            exit 1
          fi

          pom_url="https://repo.maven.apache.org/maven2/io/github/licc981/navigation3-helper/$configured_version/navigation3-helper-$configured_version.pom"
          http_status="$(curl --silent --location --retry 3 --output /dev/null --write-out '%{http_code}' "$pom_url" || true)"

          case "$http_status" in
            404)
              should_publish=true
              ;;
            200)
              should_publish=false
              echo "::notice::Version $configured_version is already on Maven Central. Running tests only."
              ;;
            *)
              echo "::error::Could not confirm whether version $configured_version exists (HTTP $http_status)"
              exit 1
              ;;
          esac

          echo "version=$configured_version" >> "$GITHUB_OUTPUT"
          echo "should_publish=$should_publish" >> "$GITHUB_OUTPUT"

      - name: Run tests
        if: steps.resolve.outputs.should_publish != 'true'
        run: ./gradlew :navigation3-helper:jvmTest :nav3-ksp-compiler:jvmTest

      - name: Publish and release ${{ steps.resolve.outputs.version }}
        if: steps.resolve.outputs.should_publish == 'true'
        env:
          RELEASE_VERSION: ${{ steps.resolve.outputs.version }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
        run: |
          missing=()
          [[ -n "$ORG_GRADLE_PROJECT_mavenCentralUsername" ]] || missing+=(MAVEN_CENTRAL_USERNAME)
          [[ -n "$ORG_GRADLE_PROJECT_mavenCentralPassword" ]] || missing+=(MAVEN_CENTRAL_PASSWORD)
          [[ -n "$ORG_GRADLE_PROJECT_signingInMemoryKey" ]] || missing+=(SIGNING_IN_MEMORY_KEY)
          [[ -n "$ORG_GRADLE_PROJECT_signingInMemoryKeyPassword" ]] || missing+=(SIGNING_IN_MEMORY_KEY_PASSWORD)

          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing repository secrets: ${missing[*]}"
            exit 1
          fi

          bash scripts/publish-maven-central.sh "$RELEASE_VERSION"
